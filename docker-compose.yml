services:
  plex-curator:
    build: .
    image: plex-curator
    container_name: plex-curator
    restart: unless-stopped
    network_mode: bridge
    ports:
      - "8088:8088"
    env_file:
      - ./data/.env
    volumes:
      - ./themes:/opt/plex-curator/themes
      - ./channels:/opt/plex-curator/channels
      - ./data:/opt/plex-curator/data
      - ./templates:/opt/plex-curator/templates
      - ./src:/opt/plex-curator/src
